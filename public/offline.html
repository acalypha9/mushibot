<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | Mushibot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fbfafc;
      color: #1c191f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e8e2ee;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(116, 39, 116, 0.06);
      max-width: 440px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #f7eef8;
      color: #742774;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1c191f;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #6b6375;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: #742774;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #5e1c5e;
    }
    .btn:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>Mushibot requires an active network connection. Please check your internet connection and try again.</p>
    <button type="button" class="btn" onclick="window.location.reload()">Retry Connection</button>
  </main>
</body>
</html>
